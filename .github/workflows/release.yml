name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versioning:
    name: Get Versioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      tag: v${{ steps.versioning.outputs.version }}
    steps:
      - name: Get Semver
        id: versioning
        uses: MCKanpolat/auto-semver-action@v1
        with:
          releaseType: patch
          incrementPerCommit: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Verify and Publish Package
    needs: [versioning]
    permissions:
      contents: read
      # npm trusted publishing: npm exchanges the job's OIDC token for a short-lived publish token, and signs the
      # provenance with it. No NPM_TOKEN.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.versioning.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No registry-url: setup-node would write an .npmrc with an auth token line (and a placeholder NODE_AUTH_TOKEN),
      # which npm would use instead of the OIDC token. npm's default registry is registry.npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer (Node 24 may bundle an older npm 11).
      - name: Update npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      # Trusted publishing (npmjs.com: kantist/quicklook, workflow release.yml) with provenance, which needs a public
      # repository and package.json's repository.url.
      - name: Publish package
        run: npm publish --access public --provenance

  release:
    name: Create Release
    needs: [versioning, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.tag }}
          name: ${{ needs.versioning.outputs.version }}
          target_commitish: ${{ github.sha }}
